<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sushi Builder 🍣</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=DM+Mono:wght@300;400;500&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1008;
    --paper: #f7f2ea;
    --red: #c0392b;
    --red-soft: #e8c4be;
    --gold: #c9973a;
    --gold-light: #f0ddb0;
    --sage: #7a9e7e;
    --sage-light: #d4e8d6;
    --border: #d4c9b0;
    --shadow: rgba(26,16,8,0.12);
  }

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: var(–paper);
color: var(–ink);
font-family: ‘DM Mono’, monospace;
min-height: 100vh;
background-image:
radial-gradient(ellipse at 10% 20%, rgba(201,151,58,0.08) 0%, transparent 50%),
radial-gradient(ellipse at 90% 80%, rgba(192,57,43,0.06) 0%, transparent 50%);
}

/* HEADER */
header {
text-align: center;
padding: 60px 20px 40px;
position: relative;
}
header::before {
content: ‘’;
display: block;
width: 1px;
height: 40px;
background: var(–gold);
margin: 0 auto 20px;
}
.header-jp {
font-family: ‘Shippori Mincho’, serif;
font-size: 13px;
letter-spacing: 0.4em;
color: var(–gold);
text-transform: uppercase;
margin-bottom: 12px;
}
header h1 {
font-family: ‘Noto Serif JP’, serif;
font-size: clamp(2.4rem, 5vw, 4rem);
font-weight: 300;
letter-spacing: -0.02em;
line-height: 1.1;
}
header h1 span {
color: var(–red);
font-weight: 700;
}
.subtitle {
margin-top: 14px;
font-size: 12px;
letter-spacing: 0.2em;
color: #8a7a5a;
text-transform: uppercase;
}

/* NAV TABS */
.tabs {
display: flex;
justify-content: center;
gap: 0;
margin: 40px auto 0;
max-width: 600px;
border: 1px solid var(–border);
border-radius: 2px;
overflow: hidden;
}
.tab {
flex: 1;
padding: 14px 20px;
background: transparent;
border: none;
cursor: pointer;
font-family: ‘DM Mono’, monospace;
font-size: 11px;
letter-spacing: 0.15em;
text-transform: uppercase;
color: #8a7a5a;
transition: all 0.2s;
border-right: 1px solid var(–border);
position: relative;
}
.tab:last-child { border-right: none; }
.tab.active {
background: var(–ink);
color: var(–paper);
}
.tab:not(.active):hover { background: var(–gold-light); }

/* MAIN LAYOUT */
.container {
max-width: 1100px;
margin: 0 auto;
padding: 40px 20px 80px;
}

/* PANELS */
.panel { display: none; }
.panel.active { display: block; }

/* MENU SECTION */
.section-title {
font-family: ‘Noto Serif JP’, serif;
font-size: 11px;
letter-spacing: 0.35em;
text-transform: uppercase;
color: var(–gold);
margin-bottom: 20px;
padding-bottom: 10px;
border-bottom: 1px solid var(–border);
display: flex;
align-items: center;
gap: 12px;
}
.section-title::after {
content: ‘’;
flex: 1;
height: 1px;
background: var(–border);
}

.category-block { margin-bottom: 44px; }

.sushi-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
gap: 16px;
}

.sushi-card {
background: white;
border: 1px solid var(–border);
border-radius: 2px;
padding: 20px;
display: flex;
align-items: center;
gap: 16px;
transition: all 0.2s;
position: relative;
overflow: hidden;
}
.sushi-card::before {
content: ‘’;
position: absolute;
left: 0; top: 0; bottom: 0;
width: 3px;
background: transparent;
transition: background 0.2s;
}
.sushi-card:hover { border-color: var(–gold); box-shadow: 0 4px 16px var(–shadow); }
.sushi-card.selected { border-color: var(–red); }
.sushi-card.selected::before { background: var(–red); }

.sushi-emoji { font-size: 2rem; flex-shrink: 0; line-height: 1; }

.sushi-info { flex: 1; min-width: 0; }
.sushi-name {
font-family: ‘Noto Serif JP’, serif;
font-size: 15px;
font-weight: 700;
margin-bottom: 4px;
}
.sushi-desc {
font-size: 10px;
color: #8a7a5a;
letter-spacing: 0.05em;
line-height: 1.5;
}
.sushi-price {
font-size: 10px;
color: var(–sage);
margin-top: 4px;
letter-spacing: 0.1em;
}

.qty-control {
display: flex;
align-items: center;
gap: 8px;
flex-shrink: 0;
}
.qty-btn {
width: 28px; height: 28px;
border: 1px solid var(–border);
background: transparent;
cursor: pointer;
font-size: 16px;
line-height: 1;
color: var(–ink);
transition: all 0.15s;
display: flex; align-items: center; justify-content: center;
border-radius: 1px;
font-family: ‘DM Mono’, monospace;
}
.qty-btn:hover { background: var(–gold-light); border-color: var(–gold); }
.qty-btn.minus:hover { background: var(–red-soft); border-color: var(–red); }
.qty-num {
font-size: 15px;
font-weight: 500;
min-width: 20px;
text-align: center;
font-family: ‘Shippori Mincho’, serif;
}

/* STICKY CART BAR */
.cart-bar {
position: fixed;
bottom: 0; left: 0; right: 0;
background: var(–ink);
color: var(–paper);
padding: 16px 24px;
display: flex;
align-items: center;
justify-content: space-between;
z-index: 100;
transform: translateY(100%);
transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.cart-bar.visible { transform: translateY(0); }
.cart-summary {
font-size: 11px;
letter-spacing: 0.1em;
color: #c9b898;
}
.cart-total {
font-family: ‘Noto Serif JP’, serif;
font-size: 22px;
font-weight: 300;
color: var(–gold);
}
.cart-cta {
background: var(–red);
color: white;
border: none;
padding: 12px 24px;
font-family: ‘DM Mono’, monospace;
font-size: 11px;
letter-spacing: 0.2em;
text-transform: uppercase;
cursor: pointer;
border-radius: 1px;
transition: background 0.2s;
}
.cart-cta:hover { background: #a93226; }

/* SHOPPING LIST PANEL */
.list-layout {
display: grid;
grid-template-columns: 1fr 340px;
gap: 32px;
align-items: start;
}
@media(max-width:700px){
.list-layout { grid-template-columns: 1fr; }
}

.ingredient-table {
width: 100%;
border-collapse: collapse;
}
.ingredient-table th {
font-size: 10px;
letter-spacing: 0.25em;
text-transform: uppercase;
color: var(–gold);
padding: 10px 12px;
text-align: left;
border-bottom: 1px solid var(–border);
}
.ingredient-table td {
padding: 12px;
border-bottom: 1px solid rgba(212,201,176,0.4);
font-size: 13px;
vertical-align: top;
}
.ingredient-table tr:last-child td { border-bottom: none; }
.ingredient-table .cat-row td {
font-size: 10px;
letter-spacing: 0.2em;
text-transform: uppercase;
color: #8a7a5a;
background: #f0ebe0;
padding: 8px 12px;
border-bottom: 1px solid var(–border);
}
.price-cell { text-align: right; color: var(–sage); font-family: ‘Shippori Mincho’, serif; }
.total-row td {
font-weight: 700;
border-top: 2px solid var(–ink) !important;
padding-top: 14px;
font-family: ‘Noto Serif JP’, serif;
}

.order-summary {
background: white;
border: 1px solid var(–border);
padding: 24px;
position: sticky;
top: 20px;
}
.order-item {
display: flex;
justify-content: space-between;
align-items: center;
padding: 10px 0;
border-bottom: 1px solid rgba(212,201,176,0.4);
font-size: 12px;
}
.order-item:last-of-type { border-bottom: none; }
.order-item-name { font-family: ‘Noto Serif JP’, serif; font-size: 13px; }
.order-item-qty { color: var(–red); font-size: 11px; letter-spacing: 0.1em; }
.order-grand-total {
margin-top: 16px;
padding-top: 16px;
border-top: 2px solid var(–ink);
display: flex;
justify-content: space-between;
align-items: baseline;
}
.order-grand-total span:first-child {
font-size: 10px;
letter-spacing: 0.2em;
text-transform: uppercase;
}
.order-grand-total span:last-child {
font-family: ‘Noto Serif JP’, serif;
font-size: 26px;
font-weight: 300;
color: var(–gold);
}

.empty-state {
text-align: center;
padding: 60px 20px;
color: #8a7a5a;
}
.empty-state .big { font-size: 3rem; margin-bottom: 12px; }
.empty-state p { font-size: 12px; letter-spacing: 0.1em; }

/* RECETTES PANEL */
.recipe-list { display: flex; flex-direction: column; gap: 32px; }

.recipe-card {
background: white;
border: 1px solid var(–border);
overflow: hidden;
}
.recipe-header {
padding: 24px 28px;
display: flex;
align-items: center;
gap: 20px;
border-bottom: 1px solid var(–border);
cursor: pointer;
user-select: none;
transition: background 0.15s;
}
.recipe-header:hover { background: #faf6ef; }
.recipe-emoji { font-size: 2.2rem; }
.recipe-title-block { flex: 1; }
.recipe-title {
font-family: ‘Noto Serif JP’, serif;
font-size: 20px;
font-weight: 700;
margin-bottom: 4px;
}
.recipe-meta { font-size: 10px; color: #8a7a5a; letter-spacing: 0.1em; }
.recipe-toggle {
font-size: 20px;
color: var(–gold);
transition: transform 0.2s;
}
.recipe-card.open .recipe-toggle { transform: rotate(45deg); }

.recipe-body {
display: none;
padding: 28px;
}
.recipe-card.open .recipe-body { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
@media(max-width:600px) {
.recipe-card.open .recipe-body { grid-template-columns: 1fr; }
}

.recipe-section-title {
font-size: 10px;
letter-spacing: 0.3em;
text-transform: uppercase;
color: var(–gold);
margin-bottom: 14px;
padding-bottom: 8px;
border-bottom: 1px solid var(–border);
}
.recipe-ingredients li {
list-style: none;
font-size: 12px;
padding: 7px 0;
border-bottom: 1px solid rgba(212,201,176,0.3);
display: flex;
justify-content: space-between;
}
.recipe-ingredients li:last-child { border-bottom: none; }
.ing-qty { color: var(–red); font-family: ‘Shippori Mincho’, serif; }

.recipe-steps ol {
list-style: none;
counter-reset: step;
}
.recipe-steps li {
counter-increment: step;
font-size: 12px;
line-height: 1.7;
padding: 10px 0 10px 36px;
border-bottom: 1px solid rgba(212,201,176,0.3);
position: relative;
}
.recipe-steps li:last-child { border-bottom: none; }
.recipe-steps li::before {
content: counter(step, decimal-leading-zero);
position: absolute;
left: 0;
font-family: ‘Shippori Mincho’, serif;
color: var(–gold);
font-size: 14px;
font-weight: 700;
line-height: 1.7;
}

.recipe-tip {
margin-top: 16px;
background: var(–sage-light);
padding: 14px 16px;
font-size: 11px;
line-height: 1.6;
color: #3a5c3e;
letter-spacing: 0.02em;
border-left: 3px solid var(–sage);
grid-column: 1 / -1;
}

/* Print button */
.print-btn {
display: block;
width: fit-content;
margin: 24px auto 0;
background: transparent;
border: 1px solid var(–ink);
padding: 12px 28px;
font-family: ‘DM Mono’, monospace;
font-size: 11px;
letter-spacing: 0.2em;
text-transform: uppercase;
cursor: pointer;
color: var(–ink);
transition: all 0.2s;
}
.print-btn:hover { background: var(–ink); color: var(–paper); }

@media print {
.tabs, .cart-bar, .print-btn { display: none !important; }
.panel { display: block !important; }
.recipe-card.open .recipe-body, .recipe-body { display: grid !important; grid-template-columns: 1fr 1fr; gap: 20px; }
}

/* Decorative watermark */
body::after {
content: ‘寿司’;
position: fixed;
right: -30px;
top: 50%;
transform: translateY(-50%) rotate(90deg);
font-family: ‘Noto Serif JP’, serif;
font-size: 120px;
color: rgba(201,151,58,0.04);
pointer-events: none;
z-index: 0;
white-space: nowrap;
}
</style>

</head>

// ============================================================
// STATE
// ============================================================
const cart = {}; // id -> qty

// ============================================================
// RENDER MENU
// ============================================================
function renderMenu() {
  const gridMap = { maki: 'grid-maki', california: 'grid-california', nigiri: 'grid-nigiri', temaki: 'grid-temaki' };
  for (const [cat, items] of Object.entries(SUSHI)) {
    const el = document.getElementById(gridMap[cat]);
    el.innerHTML = items.map(s => `
      <div class="sushi-card" id="card-${s.id}">
        <div class="sushi-emoji">${s.emoji}</div>
        <div class="sushi-info">
          <div class="sushi-name">${s.name}</div>
          <div class="sushi-desc">${s.desc}</div>
          <div class="sushi-price">~${s.priceUnit.toFixed(2)} € · ${s.pieces} pièces</div>
        </div>
        <div class="qty-control">
          <button class="qty-btn minus" onclick="changeQty('${s.id}', -1)">−</button>
          <span class="qty-num" id="qty-${s.id}">0</span>
          <button class="qty-btn plus" onclick="changeQty('${s.id}', +1)">+</button>
        </div>
      </div>
    `).join('');
  }
}

function changeQty(id, delta) {
  cart[id] = Math.max(0, (cart[id] || 0) + delta);
  document.getElementById(`qty-${id}`).textContent = cart[id];
  const card = document.getElementById(`card-${id}`);
  card.classList.toggle('selected', cart[id] > 0);
  updateCartBar();
}

function updateCartBar() {
  const total = getTotalPrice();
  const count = Object.values(cart).reduce((a, b) => a + b, 0);
  const bar = document.getElementById('cart-bar');
  document.getElementById('cart-summary').textContent = count === 0
    ? '0 plateau sélectionné'
    : `${count} plateau${count > 1 ? 'x' : ''} sélectionné${count > 1 ? 's' : ''}`;
  document.getElementById('cart-total').textContent = total.toFixed(2).replace('.', ',') + ' €';
  bar.classList.toggle('visible', count > 0);
}

function getTotalPrice() {
  let total = 0;
  for (const [id, qty] of Object.entries(cart)) {
    if (!qty) continue;
    const s = findSushi(id);
    if (s) total += s.priceUnit * qty;
  }
  return total;
}

function findSushi(id) {
  for (const items of Object.values(SUSHI)) {
    const found = items.find(s => s.id === id);
    if (found) return found;
  }
  return null;
}

// ============================================================
// RENDER LISTE
// ============================================================
function computeIngredients() {
  const totals = {}; // ingId -> total amount

  for (const [id, qty] of Object.entries(cart)) {
    if (!qty) continue;
    const s = findSushi(id);
    if (!s) continue;
    for (const ingId of s.ingredients) {
      const ing = INGREDIENTS[ingId];
      if (!ing) continue;
      if (ing.unit === 'g' || ing.unit === 'cl') {
        totals[ingId] = (totals[ingId] || 0) + ing.perPlate * qty;
      } else if (ing.unit === 'feuille' || ing.unit === 'pièce') {
        totals[ingId] = (totals[ingId] || 0) + ing.perPlate * qty;
      } else if (ing.unit === 'boîte 140g') {
        totals[ingId] = (totals[ingId] || 0) + ing.perPlate * qty;
      }
    }
  }

  // Add always-needed condiments if any sushi selected
  const hasAnything = Object.values(cart).some(v => v > 0);
  if (hasAnything) {
    for (const ingId of ALWAYS) {
      if (!totals[ingId]) totals[ingId] = 1;
    }
  }

  return totals;
}

function estimatePrice(ingId, amount) {
  const ing = INGREDIENTS[ingId];
  if (!ing) return 0;
  if (ing.unit === 'g') return (amount / 1000) * ing.priceKg;
  if (ing.unit === 'cl') return (amount / 100) * ing.priceL;
  if (ing.unit === 'boîte 140g') return Math.ceil(amount) * ing.priceUnit;
  if (ing.unit === 'feuille' || ing.unit === 'pièce') return Math.ceil(amount) * ing.priceUnit;
  return ing.priceUnit || 0;
}

function formatAmount(ingId, amount) {
  const ing = INGREDIENTS[ingId];
  if (ing.unit === 'g') return Math.ceil(amount) + 'g';
  if (ing.unit === 'cl') return Math.ceil(amount) + 'cl';
  if (ing.unit === 'boîte 140g') return Math.ceil(amount) + ' boîte(s)';
  if (ing.unit === 'feuille') return Math.ceil(amount) + ' feuille(s)';
  if (ing.unit === 'pièce') return Math.ceil(amount) + ' pièce(s)';
  return '1 unité';
}

function renderListe() {
  const el = document.getElementById('liste-content');
  const hasItems = Object.values(cart).some(v => v > 0);

  if (!hasItems) {
    el.innerHTML = `<div class="empty-state"><div class="big">🛒</div><p>Sélectionne tes sushis dans le menu pour générer ta liste de courses</p></div>`;
    return;
  }

  const totals = computeIngredients();
  const byCategory = {};
  for (const [ingId, amount] of Object.entries(totals)) {
    const ing = INGREDIENTS[ingId];
    if (!ing) continue;
    if (!byCategory[ing.cat]) byCategory[ing.cat] = [];
    byCategory[ing.cat].push({ ingId, amount, ing });
  }

  let grandTotal = 0;
  let tableRows = '';
  for (const [cat, items] of Object.entries(byCategory)) {
    tableRows += `<tr class="cat-row"><td colspan="3">${cat}</td></tr>`;
    for (const { ingId, amount, ing } of items) {
      const price = estimatePrice(ingId, amount);
      grandTotal += price;
      tableRows += `
        <tr>
          <td>${ing.name}</td>
          <td>${formatAmount(ingId, amount)}</td>
          <td class="price-cell">~${price.toFixed(2).replace('.', ',')} €</td>
        </tr>
      `;
    }
  }

  // Order summary
  let orderItems = '';
  let orderTotal = 0;
  for (const [id, qty] of Object.entries(cart)) {
    if (!qty) continue;
    const s = findSushi(id);
    if (!s) continue;
    const cost = s.priceUnit * qty;
    orderTotal += cost;
    orderItems += `
      <div class="order-item">
        <div>
          <div class="order-item-name">${s.emoji} ${s.name}</div>
        </div>
        <span class="order-item-qty">${qty}×</span>
      </div>
    `;
  }

  el.innerHTML = `
    <div class="list-layout">
      <div>
        <div class="section-title">Ingrédients à acheter</div>
        <table class="ingredient-table">
          <thead>
            <tr>
              <th>Ingrédient</th>
              <th>Quantité</th>
              <th style="text-align:right">Prix estimé</th>
            </tr>
          </thead>
          <tbody>
            ${tableRows}
            <tr class="total-row">
              <td colspan="2">Total estimé courses</td>
              <td class="price-cell">~${grandTotal.toFixed(2).replace('.', ',')} €</td>
            </tr>
          </tbody>
        </table>
        <p style="font-size:10px;color:#8a7a5a;margin-top:12px;letter-spacing:0.05em">* Prix moyens indicatifs en grande surface France 2026. Les prix réels peuvent varier.</p>
        <button class="print-btn" onclick="window.print()">🖨 Imprimer la liste</button>
      </div>
      <div>
        <div class="section-title">Ta commande</div>
        <div class="order-summary">
          ${orderItems}
          <div class="order-grand-total">
            <span>Total sushis</span>
            <span>~${orderTotal.toFixed(2).replace('.', ',')} €</span>
          </div>
        </div>
      </div>
    </div>
  `;
}

// ============================================================
// RENDER RECETTES
// ============================================================
function renderRecettes() {
  const el = document.getElementById('recettes-content');
  const hasItems = Object.values(cart).some(v => v > 0);

  if (!hasItems) {
    el.innerHTML = `<div class="empty-state"><div class="big">📖</div><p>Sélectionne tes sushis dans le menu pour voir les recettes correspondantes</p></div>`;
    return;
  }

  // Collect unique recipe keys from selection
  const usedRecipes = new Set();
  for (const [id, qty] of Object.entries(cart)) {
    if (!qty) continue;
    const s = findSushi(id);
    if (s) usedRecipes.add(s.recipeKey);
  }

  // Always show riz recipe first
  let cards = `
    <div class="recipe-card" id="recipe-riz">
      <div class="recipe-header" onclick="toggleRecipe('riz')">
        <span class="recipe-emoji">🍚</span>
        <div class="recipe-title-block">
          <div class="recipe-title">Le riz à sushi — la base</div>
          <div class="recipe-meta">⏱ 30 min · Essentiel pour tous les sushis</div>
        </div>
        <span class="recipe-toggle">+</span>
      </div>
      <div class="recipe-body">
        <div>
          <div class="recipe-section-title">Ingrédients (4 pers.)</div>
          <ul class="recipe-ingredients">
            <li>Riz japonais rond <span class="ing-qty">400g cru</span></li>
            <li>Vinaigre de riz <span class="ing-qty">6 c. à soupe</span></li>
            <li>Sucre <span class="ing-qty">2 c. à café</span></li>
            <li>Sel <span class="ing-qty">1 c. à café</span></li>
          </ul>
        </div>
        <div>
          <div class="recipe-section-title">Étapes</div>
          <ol class="recipe-steps">
            <li>Rincer le riz 3-4 fois jusqu'à ce que l'eau soit claire. Égoutter 30 min.</li>
            <li>Cuire le riz avec le même volume d'eau + un peu plus (ex: 400g riz → 500ml eau). Porter à ébullition, couvrir, feu doux 12 min, puis éteindre et laisser reposer 10 min.</li>
            <li>Mélanger vinaigre + sucre + sel dans un bol jusqu'à dissolution.</li>
            <li>Verser le mélange sur le riz chaud et mélanger délicatement avec une spatule, en faisant des gestes tranchants (ne pas écraser).</li>
            <li>Éventer le riz en mélangeant pour le refroidir rapidement. Il doit être tiède et brillant.</li>
            <li>Couvrir d'un torchon humide et utiliser dans l'heure.</li>
          </ol>
        </div>
        <div class="recipe-tip">💡 Le riz ne doit pas être ni trop chaud ni trop froid quand tu travailles avec. Tiède = idéal. Ne le mets surtout pas au frigo — il durcirait.</div>
      </div>
    </div>
  `;

  for (const key of usedRecipes) {
    const r = RECIPES[key];
    if (!r) continue;
    const ingList = r.baseIngredients.map(i => `<li>${i.name} <span class="ing-qty">${i.qty}</span></li>`).join('');
    const stepList = r.steps.map(s => `<li>${s}</li>`).join('');
    cards += `
      <div class="recipe-card" id="recipe-${key}">
        <div class="recipe-header" onclick="toggleRecipe('${key}')">
          <span class="recipe-emoji">${r.emoji}</span>
          <div class="recipe-title-block">
            <div class="recipe-title">${r.name}</div>
            <div class="recipe-meta">⏱ ${r.time} · ${r.diff} · ${r.desc}</div>
          </div>
          <span class="recipe-toggle">+</span>
        </div>
        <div class="recipe-body">
          <div>
            <div class="recipe-section-title">Ingrédients (4 pers.)</div>
            <ul class="recipe-ingredients">${ingList}</ul>
          </div>
          <div>
            <div class="recipe-section-title">Étapes</div>
            <ol class="recipe-steps">${stepList}</ol>
          </div>
          <div class="recipe-tip">${r.tip}</div>
        </div>
      </div>
    `;
  }

  el.innerHTML = `<div class="recipe-list">${cards}</div>`;
}

function toggleRecipe(key) {
  const card = document.getElementById(`recipe-${key}`);
  card.classList.toggle('open');
}

// ============================================================
// TABS
// ============================================================
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    const tabs = ['menu', 'liste', 'recettes'];
    t.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${tab}`).classList.add('active');

  if (tab === 'liste') renderListe();
  if (tab === 'recettes') renderRecettes();
}

// ============================================================
// INIT
// ============================================================
renderMenu();
