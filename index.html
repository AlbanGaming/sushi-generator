<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sushi Builder 🍣</title>

  <!-- Police Google Fonts (chargée depuis internet) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=DM+Mono:wght@300;400;500&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">

  <!-- Notre feuille de style (chemin relatif = même dossier) -->
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

  <!-- =====================================================
       EN-TÊTE DU SITE
       ===================================================== -->
  <header>
    <div class="header-jp">壽司 職人</div>
    <h1>Sushi <span>Builder</span></h1>
    <p class="subtitle">Composez votre plateau — liste de courses incluse</p>

    <!-- ONGLETS DE NAVIGATION -->
    <nav class="tabs">
      <!-- onclick="switchTab('menu')" → appelle la fonction JS switchTab avec le paramètre 'menu' -->
      <button class="tab active" onclick="switchTab('menu')">① Menu</button>
      <button class="tab"        onclick="switchTab('liste')">② Liste de courses</button>
      <button class="tab"        onclick="switchTab('recettes')">③ Recettes</button>
    </nav>
  </header>

  <!-- =====================================================
       CONTENU PRINCIPAL
       ===================================================== -->
  <div class="container">

    <!-- ── PANEL 1 : MENU ──────────────────────────────── -->
    <!--
      "panel active" = visible au chargement
      "panel"        = caché (le JS ajoute/retire la classe "active")
    -->
    <div class="panel active" id="panel-menu">

      <div class="category-block">
        <div class="section-title">Makis — rouleaux fins</div>
        <!-- Les cartes sushi seront injectées ici par le JS -->
        <div class="sushi-grid" id="grid-maki"></div>
      </div>

      <div class="category-block">
        <div class="section-title">California Rolls — riz à l'extérieur</div>
        <div class="sushi-grid" id="grid-california"></div>
      </div>

      <div class="category-block">
        <div class="section-title">Nigiris — riz moulé</div>
        <div class="sushi-grid" id="grid-nigiri"></div>
      </div>

      <div class="category-block">
        <div class="section-title">Temakis — cônes à la main</div>
        <div class="sushi-grid" id="grid-temaki"></div>
      </div>

    </div><!-- fin #panel-menu -->

    <!-- ── PANEL 2 : LISTE DE COURSES ─────────────────── -->
    <div class="panel" id="panel-liste">
      <!-- Rempli dynamiquement par renderListe() dans app.js -->
      <div id="liste-content"></div>
    </div>

    <!-- ── PANEL 3 : RECETTES ──────────────────────────── -->
    <div class="panel" id="panel-recettes">
      <!-- Rempli dynamiquement par renderRecettes() dans app.js -->
      <div id="recettes-content"></div>
    </div>

  </div><!-- fin .container -->

  <!-- =====================================================
       BARRE DE PANIER (fixe en bas de l'écran)
       Cachée par défaut, apparaît dès qu'on sélectionne un plat
       ===================================================== -->
  <div class="cart-bar" id="cart-bar">
    <div>
      <div class="cart-summary" id="cart-summary">0 plateau sélectionné</div>
      <div class="cart-total"   id="cart-total">0,00 €</div>
    </div>
    <button class="cart-cta" onclick="switchTab('liste')">Voir ma liste →</button>
  </div>

  <!-- Notre script JS (toujours en FIN de body pour que le HTML soit chargé avant) -->
  <script src="scripts/app.js"></script>

</body>
</html>
